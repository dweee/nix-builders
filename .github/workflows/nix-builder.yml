# Copy this file to your repository at:
# .github/workflows/nix-builder.yml
#
# This workflow sets up on-demand distributed Nix remote builders using
# the reusable workflow from dweee/Nix_Remote-Builders-Distributed.
#
# Public or private: builders receive only the derivations they build over
# Tailscale SSH, never through this repository. In a public repository, runs
# and logs are visible, so this template keeps metadata out of them:
#   - the run name is only the random session ID;
#   - cache URLs and keys are masked in every log line;
#   - Magic Nix Cache is off (fork pull requests can read Actions caches);
#   - earlier completed runs are deleted at the start of each session, and
#     nix-remote deletes each session's run when it ends (`delete_runs = true`).
# Also set log retention to 1 day and require approval for outside
# contributors' workflows in the repository's Actions settings.
#
# Cache reads use the shared Niks3 read-only GitHub OIDC grant; publication uses
# its independent publisher audience. No static private cache token is passed.
# Set NIKS3_PUSH_ENABLED=false or skip_cache_push for a read-only session.
# The endpoint and optional additional public cache metadata remain secrets so
# the reusable workflow can mask them in public logs.

name: "Nix Remote Builder"
# Only the random session ID; nix-remote leaves `target` empty unless
# `show_target = true` is set in its config.
run-name: "nix-remote [${{ inputs.session_id }}]"

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "Unique session identifier"
        required: true
        type: string
      target:
        description: "Target or Nix command being executed"
        type: string
        default: ""
      matrix:
        description: "JSON matrix specification ({ include: [...] })"
        required: true
        type: string
      environment:
        description: "GitHub Actions environment name to source secrets from (optional)"
        type: string
        default: ""
      tailscale_tags:
        description: "Tailscale ACL tags to apply to runner nodes (optional)"
        type: string
        default: "tag:nix-builder"
      preserve_run_history:
        description: "Keep earlier completed workflow runs for diagnostic sessions"
        type: boolean
        default: false
      skip_cache_push:
        description: "Do not publish outputs from this session"
        type: boolean
        default: false
      timeout_startup:
        description: "Timeout in seconds to wait for initial Tailscale connection (0 to disable)"
        type: number
        default: 300
      timeout_idle:
        description: "Timeout in seconds of inactivity before runner disconnects (0 to disable)"
        type: number
        default: 300
      timeout_linger:
        description: "Timeout in seconds to keep runner alive after build completes (0 to disable)"
        type: number
        default: 0

jobs:
  remote-builder:
    name: "Remote Builder Dispatch"
    permissions:
      id-token: write
      contents: read
      actions: write # purge_runs deletes earlier runs
    uses: dweee/Nix_Remote-Builders-Distributed/.github/workflows/nix-builder.yml@030df878e5564ec2cd5a70e6107b27403d5cb608
    with:
      # Optional: specify a GitHub Actions Environment name if your Tailscale
      # secrets (OAuth or OIDC) are stored within an Environment
      # (e.g. "Nix Builders" or your custom env name).
      # If using standard Repository Secrets, set this to "" or omit this line.
      environment: ${{ inputs.environment != '' && inputs.environment || '' }}
      tailscale_tags: ${{ inputs.tailscale_tags }}
      matrix: ${{ inputs.matrix }}
      session_id: ${{ inputs.session_id }}
      target: ${{ inputs.target }}
      timeout_startup: ${{ inputs.timeout_startup != '' && format('{0}', inputs.timeout_startup) || '300' }}
      timeout_idle: ${{ inputs.timeout_idle != '' && format('{0}', inputs.timeout_idle) || '300' }}
      timeout_linger: ${{ inputs.timeout_linger != '' && format('{0}', inputs.timeout_linger) || '0' }}
      attic_substitute: "false"
      attic_push: "false"
      niks3_substitute: "true"
      niks3_push: ${{ !inputs.skip_cache_push && vars.NIKS3_PUSH_ENABLED != 'false' && 'true' || 'false' }}
      # Include copied and completed build-only outputs, including work retained
      # after a later build failure. Operators may select builder-built paths.
      push_paths: ${{ vars.NIKS3_PUSH_PATHS == 'built' && 'built' || 'all' }}
      magic_nix_cache: "false"
      purge_runs: ${{ inputs.preserve_run_history && 'false' || 'true' }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      NIKS3_ENDPOINT: ${{ secrets.NIKS3_ENDPOINT }}
      NIX_SUBSTITUTERS: ${{ secrets.NIX_SUBSTITUTERS }}
      NIX_TRUSTED_PUBLIC_KEYS: ${{ secrets.NIX_TRUSTED_PUBLIC_KEYS }}
